show: true
eyebrow: What we offer
heading: Activities, field trips, and events for every age
link_label: Learn more
cards:
  - icon: parents
    title: Parents
    body: Monthly parent meetings for encouragement and support — topics like Intro to Homeschooling and Homeschooling High School. Free for members; your first meeting is free as a guest, then $10 at the door.
  - icon: kids
    title: Kids
    body: 'Kids’ Day outings about once a month for K–7th grade: the pumpkin patch in October, The Nutcracker in December, Edmonds Beach at low tide in spring, plus museums, hikes, swimming, and skating. Parents attend with their kids.'
  - icon: teens
    title: Teens
    body: Social events and community service for members ages 14 and up, with traditions like the Corn Maze & Bonfire, Homecoming, and Spring Formal. Seniors also get monthly get-togethers with their graduating class.
extras:
  - title: Student Leadership Team
    body: Teens grow as leaders on a team that serves under the Board to support H.O.M.E., build leadership skills, foster godly character, and promote fellowship among students and families.
    tone: sky
  - title: Graduation
    body: Each June, H.O.M.E. sponsors a graduation ceremony personalized to that year’s class — speakers, music, worship, and fellowship, followed by a reception and a surprise Grads Night Out.
    tone: mint
