      - icon: paw
        title: Woodland Park Zoo Membership
        body: H.O.M.E. members have access to a Woodland Park Zoo membership card that can be checked out for free admission to the zoo for two adults and their children. Please email [membership@home-wa.org](mailto:membership@home-wa.org) to reserve the card. Allow 48 hours for a response. Include your name, two date & time choices, and the number of people in your party. We will email or text you a digital card to show for entry. Enter between 9:30 a.m. and 1:30 p.m. any day of the week.
      - icon: teens
