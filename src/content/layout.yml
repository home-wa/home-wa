  - type: about
    show: true
    eyebrow: Who we are
    heading: A warm community for your homeschooling journey
    body: |-
      Home Oriented Meaningful Education (H.O.M.E.) is here to support families on their homeschooling journey. We host activities, field trips, and events for all ages to create opportunities for kids and families to have unique experiences alongside their individual homeschooling journeys.

      We also support homeschooling parents by providing resources, connections, and encouragement in a warm, faith-based community where families can learn and thrive together.

      Since 1986, H.O.M.E. has welcomed hundreds of families across North King and South Snohomish counties. While our group is rooted in Christian values, everyone is welcome to join.

      Want to know more? Visit our [Member Benefits](#benefits) section to discover everything H.O.M.E. has to offer.

      H.O.M.E. is a registered nonprofit organization committed to serving our community. Federal Tax ID (EIN): 91-1731504.
    image: /uploads/about-classroom-stem.webp
    image_alt: Students and parents gathered around a table building a model structure together during a H.O.M.E. class
  - type: programs
    show: true
    anchor: benefits
    eyebrow: Member benefits
    heading: What membership includes
    link_label: ''
    cards:
      - icon: parents
        title: Parent Meetings
        body: Parent meetings are planned for the encouragement and support of homeschooling parents, and occasionally their middle school or high school students will be invited. Topics vary. Check out the [events](#events) section for info on our next parent meeting!
      - icon: kids
        title: Kids' Day Activities
        body: A mix of fun and educational events are planned at least once a month for kids to provide enrichment and social experiences. This is a great opportunity to get access to discounted entry to theatre arts events and educational field trips. H.O.M.E. makes these opportunities possible for homeschool students to experience for themselves, and with friends!
        link_label: More about Kids' Day
        link_url: '#kids-day'
      - icon: music
        title: Teen Events
        body: Teen social events create the connection and community needed to navigate the unique journey of homeschooling. H.O.M.E. provides events that are fun and facilitate positive experiences with peers. How fantastic that homeschool teens can also experience dances like Homecoming and Spring Formal! Check out the [events](#events) section for the next Teen event.
        link_label: More about Teens
