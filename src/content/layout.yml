  - type: text
    show: true
    anchor: kids-day
    eyebrow: Kids' Day
    heading: Kids Day Events
    background: cloud
    centered: false
    body: |-
      A mix of fun and educational events are planned at least once a month for kids to provide enrichment and social experiences. This is a great opportunity to get access to discounted entry to theatre arts events and educational field trips. H.O.M.E. makes these opportunities possible for homeschool students to experience for themselves, and with friends!

      Traditional activities include visiting the pumpkin patch in October, attending The Nutcracker in December, and visiting Edmonds Beach at low tide in the spring. We also offer various opportunities to visit museums, go for hikes, meet up for swimming or skating. Check out our [events](#events) section for the next Kids Day event!

      **Please note:** Kids' Day events are not drop-off activities; we expect parents to attend with their children as a family event.

      Email [kidsday@home-wa.org](mailto:kidsday@home-wa.org) for more information.
  - type: text
    show: true
    anchor: teens
    eyebrow: Teens
    heading: Teen Events
    background: white
    centered: false
    body: |-
      Teen social events create the connection and community needed to navigate the unique journey of homeschooling. H.O.M.E. provides events that are fun and facilitate positive experiences with peers. How fantastic that homeschool teens can also experience dances like Homecoming and Spring Formal!

      **Age requirements:** Teen events are for students ages 14 and up. If you have additional questions, contact [teens@home-wa.org](mailto:teens@home-wa.org).

      Please note the H.O.M.E. Dress Code for all events:

      **General Dress Code**

      Clothing should reflect modesty and follow these general guidelines: Shorts, skirts, and rips in jeans should be below fingertip level with arms straight down at the sides (wearing tights or nylons under shorter lengths is not sufficient). Shirts and dresses should be modest, and not show midriffs, chests or cleavage. No strapless dresses or shirts are allowed. No underwear should be exposed. No vulgar graphics are allowed that depict sexually suggestive expressions or actions, profanity, drugs, alcohol, or tobacco, or which degrade the integrity of individual groups.
  - type: text
    show: true
    anchor: graduation
    eyebrow: Graduation
    heading: Homeschool Graduation
    background: cloud
    centered: false
    body: H.O.M.E. sponsors a graduation ceremony each year in June, personalized to the students who are in that particular graduating class. It is a special rite of passage and H.O.M.E. helps homeschooling families give this occasion the honor and significance it deserves!
    button_label: ''
    button_url: JOINIT_GRADUATION_URL
  - type: benefits
    show: true
    anchor: join-us
    eyebrow: Join us
    heading: Join H.O.M.E.
    button_label: Become a Member
    items: []
    cost: |-
      H.O.M.E. membership is open to any homeschooling family who would like to join. We would love to have you as part of this great community.

      You can sign up anytime throughout the year for access to the events that would best support your family: parent meetings, kids and teen events, dances, and graduation.

      The cost for an annual membership is $55 per family. Each membership is active until Sep. 1 and there is no automatic renewal. Membership dues are non-refundable.
  - type: events
    show: true
    heading: Events and calendar
    body: Our event calendar is for members, and events are hidden for safety and security reasons. Members can see and register for events through our member portal. Not a member yet but curious? Email us and we’ll tell you what’s coming up.
    button_label: See Events (members)
    email_label: Not a member? Email us for info
  - type: faq
    show: true
    eyebrow: Good to know
    heading: Questions families ask before joining
    intro: Whether you’re just starting to think about homeschooling or have been at it for years, here’s what most families want to know first.
    card_heading: Still have a question?
    card_body: Send us a note and a board member will get back to you. Or come to your first parent meeting — it’s free, and it’s the easiest way to meet us.
    card_button: Email us
    items:
      - question: Do I have to be a Christian to join?
        answer: No. While our group is rooted in Christian values, everyone is welcome to join.
      - question: Who can join, and what does it cost?
        answer: H.O.M.E. membership is open to any homeschooling family who would like to join. The cost for an annual membership is $55 per family. Each membership is active until Sep. 1 and there is no automatic renewal. Membership dues are non-refundable.
      - question: Are Kids’ Days drop-off events?
        answer: 'No. Kids’ Day events are not drop-off activities: parents attend with their children.'
      - question: Can non-members come to events?
        answer: Sometimes. Your first parent meeting is free, and after that it’s $10 at the door. Some Kids’ Day events are open to non-members for an extra fee. Event refunds are available only up to the registration deadline.
      - question: I’m new to homeschooling in Washington. Where do I start?
        answer: File a Declaration of Intent with your local school district by September 15 each year. The [Washington Homeschool Organization](https://washhomeschool.org) walks through the state requirements, and [HSLDA](https://hslda.org) covers legal questions. Our parent meetings are a great place to ask the rest.
  - type: cta
    show: true
    heading: Ready to join our community?
    body: Membership signup takes just a few minutes.
    button_label: Become a Member
