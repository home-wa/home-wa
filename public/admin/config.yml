backend:
  name: github
  repo: home-wa/home-wa
  branch: main
  # Login helper: Cloud Function "cmsauth" (functions/index.js), served at /api/** via Hosting
  base_url: https://home-wa.web.app
  auth_endpoint: api/auth

# Local editing without GitHub: run `npx decap-server` and open /admin on the dev server.
local_backend: true

media_folder: public/uploads
public_folder: /uploads
site_url: https://home-wa.web.app
display_url: https://home-wa.web.app

collections:
  - name: landing
    label: Landing page
    files:
      - name: landing
        label: Landing page
        file: src/content/landing.json
        fields:
          - { label: Hero headline, name: hero_headline, widget: string }
          - { label: Hero subhead, name: hero_subhead, widget: text }
          - { label: Hero image, name: hero_image, widget: image }
          - { label: Hero image alt, name: hero_alt, widget: string }
          - { label: About text, name: about_body, widget: markdown, buttons: [bold, italic, link], editor_components: [] }
          - { label: About image, name: about_image, widget: image }
          - { label: About image alt, name: about_alt, widget: string }
          - label: Program cards
            name: cards
            widget: list
            min: 3
            max: 3
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Blurb, name: body, widget: text }
          - { label: Membership cost line, name: benefits_cost, widget: string }
          - { label: Benefits, name: benefits_items, widget: list, field: { label: Benefit, name: item, widget: string } }
          - { label: Contact email, name: contact_email, widget: string }
          - { label: Join It — membership checkout URL, name: join_url, widget: string }
          - { label: Join It — member login URL, name: login_url, widget: string }
          - { label: Join It — member portal / events URL, name: portal_url, widget: string }
          - { label: Facebook URL, name: facebook_url, widget: string, required: false }
          - { label: Instagram URL, name: instagram_url, widget: string, required: false }
          - { label: Teens Instagram URL, name: teens_instagram_url, widget: string, required: false }
