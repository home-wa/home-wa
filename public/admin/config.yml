backend:
  name: github
  repo: home-wa/home-wa
  branch: main
  # Login helper: Cloud Function "cmsauth" (functions/index.js), served at /api/** via Hosting
  base_url: https://home-wa.web.app
  auth_endpoint: api/auth

# Local editing without GitHub: run `npx decap-server` and open /admin on the dev server.
local_backend: true

media_folder: public/uploads
public_folder: /uploads
site_url: https://home-wa.web.app
display_url: https://home-wa.web.app

collections:
  - name: landing
    label: Landing page
    files:
      - name: landing
        label: Landing page
        file: src/content/landing.json
        fields:
          - { label: Hero headline, name: hero_headline, widget: string }
          - { label: Hero subhead, name: hero_subhead, widget: text }
          - { label: Hero image, name: hero_image, widget: image }
          - { label: Hero image alt, name: hero_alt, widget: string }
          - { label: About text, name: about_body, widget: markdown, buttons: [bold, italic, link], editor_components: [] }
          - { label: About image, name: about_image, widget: image }
          - { label: About image alt, name: about_alt, widget: string }
          - label: Program cards
            name: cards
            widget: list
            min: 3
            max: 3
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Blurb, name: body, widget: text }
          - { label: Membership cost line, name: benefits_cost, widget: string }
          - { label: Benefits, name: benefits_items, widget: list, field: { label: Benefit, name: item, widget: string } }
          - { label: Contact email, name: contact_email, widget: string }
          - { label: Join It — membership checkout URL, name: join_url, widget: string }
          - { label: Join It — member login URL, name: login_url, widget: string }
          - { label: Join It — member portal / events URL, name: portal_url, widget: string }
          - { label: Facebook URL, name: facebook_url, widget: string, required: false }
          - { label: Instagram URL, name: instagram_url, widget: string, required: false }
          - { label: Teens Instagram URL, name: teens_instagram_url, widget: string, required: false }
          - label: Theme (colors & fonts)
            name: theme
            widget: object
            collapsed: true
            hint: "Pick a preset, then optionally override single colors. Leave overrides empty to use the preset. Tip: preview presets instantly on the live site with ?palette=a, b, c or d (and &font=grotesk, sora, jakarta, archivo, barlow, redhat; &buttons=pill, rounded, square)."
            fields:
              - label: Color preset
                name: preset
                widget: select
                default: current
                options:
                  - { label: "Current (today's look)", value: current }
                  - { label: "A · Brand Classic", value: a }
                  - { label: "B · Light & Airy", value: b }
                  - { label: "C · Bold Modern", value: c }
                  - { label: "D · Mint Header", value: d }
              - label: Heading font
                name: heading_font
                widget: select
                default: nunito
                hint: "Sharper, angular options per Alex's notes. Nunito is the original rounded font."
                options:
                  - { label: "Nunito (original, rounded)", value: nunito }
                  - { label: "Space Grotesk", value: grotesk }
                  - { label: "Sora", value: sora }
                  - { label: "Plus Jakarta Sans", value: jakarta }
                  - { label: "Archivo", value: archivo }
                  - { label: "Barlow Semi Condensed", value: barlow }
                  - { label: "Red Hat Display", value: redhat }
              - label: Body font
                name: body_font
                widget: select
                default: paired
                options:
                  - { label: "Recommended for the heading font", value: paired }
                  - { label: "Source Sans 3 (original)", value: source }
                  - { label: "Inter", value: inter }
                  - { label: "IBM Plex Sans", value: plex }
                  - { label: "Barlow", value: barlow }
                  - { label: "Red Hat Text", value: redhat }
              - label: Button shape
                name: button_shape
                widget: select
                default: rounded
                options:
                  - { label: "Rounded rectangle (default)", value: rounded }
                  - { label: "Pill", value: pill }
                  - { label: "Square-ish", value: square }
              - { label: Primary color (headings, buttons), name: primary, widget: color, required: false }
              - { label: Secondary color, name: secondary, widget: color, required: false }
              - { label: Accent color (green button, highlights), name: accent, widget: color, required: false }
              - { label: Header background, name: header_bg, widget: color, required: false }
              - { label: Header text, name: header_text, widget: color, required: false }
              - { label: Light background, name: light_bg, widget: color, required: false }
              - { label: Dark text, name: dark_text, widget: color, required: false }
